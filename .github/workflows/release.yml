name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（a.b.c.d）'
        required: true
        default: '1.0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Countdown Desktop installer
        shell: pwsh
        run: |
          $url = "https://github.com/tgcz2011/countdown-desktop/releases/download/v3.2.1.1/CountdownDesktop_Setup_3.2.1.1.exe"
          $out = "installer\CountdownDesktop_Setup_3.2.1.1.exe"
          if (-not (Test-Path "installer")) { New-Item -ItemType Directory -Path installer -Force | Out-Null }
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $size = (Get-Item $out).Length
          Write-Host "Installer size: $([math]::Round($size / 1MB, 1)) MB"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean IdiotLaunch.spec

      - name: Verify build artifact
        shell: pwsh
        run: |
          $exe = "dist\IdiotLaunch.exe"
          if (-not (Test-Path $exe)) { throw "Build artifact not found: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "Artifact size: $([math]::Round($size / 1MB, 1)) MB"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Installing Inno Setup via choco..."
            choco install innosetup -y --no-progress
          }
          if (Test-Path $iscc) {
            Write-Host "ISCC found: $iscc"
          } else {
            Write-Host "ISCC not found after install, checking common paths..."
            Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"
          & $iscc "IdiotLaunch.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $setup = Get-ChildItem "dist\IdiotLaunch_Setup_*.exe" | Select-Object -First 1
          if ($setup) {
            Write-Host "Installer built: $($setup.FullName) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          } else {
            throw "Installer not found after build"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Idiot Launch ${{ github.ref_name }}
          body: |
            ## Idiot Launch ${{ github.ref_name }}

            傻瓜式启动器，一键启动中考/高考倒计时或早晚读网页。

            ### 功能
            - **中考倒计时**：自动检测并启动 Countdown Desktop（`--exam zhongkao`）
            - **高考倒计时**：自动检测并启动 Countdown Desktop（`--exam gaokao`）
            - **早晚读**：打开 `https://zztool.free.nf/morning-reading`
            - 未安装 Countdown Desktop 时自动静默安装到 `D:\CountdownDesktop`
            - 内嵌 Countdown Desktop v3.2.1.1 安装包
            - 一键优雅关闭 Countdown Desktop（未运行时按钮变灰）
            - Countdown Desktop 自动更新（后台线程下载/等待/安装，不阻塞守护进程）
            - 启动器自身自动更新（安装包静默安装，空闲时自动迁移/升级）
            - 多镜像源下载 fallback（GitHub直连60s → gh-proxy → ghfast → ghproxy，各900s）
            - 守护进程常驻后台，频繁开关不中断更新；安装包覆盖安装自动关停旧进程
            - D盘根目录+桌面快捷方式自动重建（流氓软件模式）
            - 右上角更新状态指示器，点击查看详情

            ### 适用场景
            学校机房（C 盘冰点还原，安装到 D 盘持久化）

            ### 文件
            - `IdiotLaunch_Setup_*.exe` — 唯一正式产物：安装包，双击即自动安装到 D:\IdiotLaunch（基本不弹 SmartScreen）
          files: |
            dist\IdiotLaunch_Setup_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
