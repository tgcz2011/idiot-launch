name: Build and Release (Flutter + Python)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # runner 控制台是 cp1252：脚本里任何中文输出都可能让 Python 抛
      # UnicodeEncodeError（真实事故：CI 挂在"生成 PE 元数据"这步）
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Read version and verify it matches the tag
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path "src\core.py" -Pattern 'LAUNCHER_VERSION\s*=\s*"([^"]+)"'
          if (-not $m) { throw "src/core.py 里找不到 LAUNCHER_VERSION" }
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "LAUNCHER_VERSION = $ver"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $ver) {
              throw "tag ($tag) 与 src/core.py 的 LAUNCHER_VERSION ($ver) 不一致。请先跑 tools/bump_version.py 再打 tag。"
            }
          }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Generate PE version metadata
        shell: pwsh
        run: |
          python tools/gen_version_info.py "${{ steps.ver.outputs.version }}" "IdiotLaunch.exe" "傻瓜启动器"
          python tools/gen_version_info.py "${{ steps.ver.outputs.version }}" "IdiotLaunchBackend.exe" "傻瓜启动器后端" "version_info_backend.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit tests
        run: python tools/test_core.py

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Flutter test
        working-directory: flutter_app
        run: flutter test

      - name: Build Python backend (PyInstaller)
        env:
          # 只接受长期 PAT（可选）。以前这里塞的是 secrets.GITHUB_TOKEN ——
          # 那是 Actions 的临时令牌，构建完就失效，却被打进了 exe：
          # 装机之后所有 GitHub API 调用都是 401，更新兜底渠道等于废掉。
          UPDATER_PAT: ${{ secrets.UPDATER_PAT }}
        shell: pwsh
        run: |
          $secretsPath = "src\_secrets.py"
          if ($env:UPDATER_PAT) {
            $pyCode = "GITHUB_TOKEN = '$($env:UPDATER_PAT)'`n"
            Write-Host "使用 UPDATER_PAT 作为 GitHub token（长期有效）"
          } else {
            # 没有长期 token 就别放：未认证 60 次/小时够用，比放个死 token 强
            $pyCode = "GITHUB_TOKEN = ''`n"
            Write-Host "未配置 UPDATER_PAT，后端按未认证方式访问 GitHub API"
          }
          [System.IO.File]::WriteAllText($secretsPath, $pyCode, (New-Object System.Text.UTF8Encoding $false))
          pyinstaller --noconfirm --clean backend.spec

      - name: Build Flutter frontend (release)
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $flutterExe = "flutter_app\build\windows\x64\runner\Release\IdiotLaunch.exe"
          $backendExe = "dist\backend\IdiotLaunchBackend.exe"
          if (-not (Test-Path $flutterExe)) { throw "Flutter exe not found: $flutterExe" }
          if (-not (Test-Path $backendExe)) { throw "Backend exe not found: $backendExe" }
          Write-Host "Flutter exe: $((Get-Item $flutterExe).Length) bytes"
          Write-Host "Backend exe: $((Get-Item $backendExe).Length) bytes"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue
          if ($iscc) { Write-Host "已预装 Inno Setup"; exit 0 }
          # 优先固定版本（可复现），该版本在 choco 上不存在时回退到最新版
          choco install innosetup --version=6.4.3 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "指定版本安装失败，改用最新版"
            choco install innosetup -y --no-progress
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "使用 $iscc"
          & $iscc "IdiotLaunch.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }

      - name: Compute installer SHA-256
        id: hash
        shell: pwsh
        run: |
          $expected = "dist\IdiotLaunch_Setup_${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $expected)) { throw "安装包不存在: $expected" }
          $hash = (Get-FileHash -Path $expected -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  IdiotLaunch_Setup_${{ steps.ver.outputs.version }}.exe" |
            Set-Content -Path "dist\IdiotLaunch_Setup_${{ steps.ver.outputs.version }}.exe.sha256" -Encoding ascii

      - name: Generate release body
        id: body
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $isBeta = $ver -match 'beta|alpha|rc|pre'
          $betaNote = if ($isBeta) { "`n> **这是 Beta 测试版本，可能不稳定。生产环境请使用正式版。**`n" } else { "" }
          $body = @"
          ## 傻瓜启动器 $ver
          $betaNote
          ### 安装
          1. 下载下面的 ``IdiotLaunch_Setup_$ver.exe``
          2. 双击即可，无需选择安装位置（固定装在 D:\IdiotLaunch，避开冰点还原）
          3. 装完自动启动，桌面和 D 盘根目录会出现「傻瓜启动器」图标

          ### 更新说明
          - 关闭窗口 = 最小化到托盘（右键托盘图标可以重新打开或彻底退出）
          - 顶部横幅出现「可一键更新至 vX」时点一下即可更新，会显示安装进度
          - 设置页新增深色主题、自动更新/遥测开关和后台行为说明

          ### 校验和（SHA-256）
          ``${{ steps.hash.outputs.sha256 }}``
          可在命令行用 ``certutil -hashfile IdiotLaunch_Setup_$ver.exe SHA256`` 核对。
          "@
          [System.IO.File]::WriteAllText("release_body.md", $body, (New-Object System.Text.UTF8Encoding $false))

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 傻瓜启动器 ${{ steps.ver.outputs.version }}
          body_path: release_body.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            dist/IdiotLaunch_Setup_*.exe
            dist/IdiotLaunch_Setup_*.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Supabase latest_version
        if: success()
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          if (-not $env:SUPABASE_SERVICE_KEY) { Write-Host "没有配置 SUPABASE_SERVICE_KEY，跳过"; exit 0 }
          $ver = "${{ steps.ver.outputs.version }}"
          $isBeta = $ver -match 'beta|alpha|rc|pre'
          $channel = if ($isBeta) { "beta" } else { "stable" }
          $setupName = "IdiotLaunch_Setup_$ver.exe"
          $downloadUrl = "https://github.com/tgcz2011/idiot-launch/releases/download/${{ github.ref_name }}/$setupName"
          $supabaseUrl = "https://tiofmybnepcheudgfysa.supabase.co"
          $headers = @{
            "apikey" = $env:SUPABASE_SERVICE_KEY
            "Authorization" = "Bearer $env:SUPABASE_SERVICE_KEY"
            "Content-Type" = "application/json"
            "Prefer" = "return=minimal"
          }
          try {
            if ($channel -eq "stable") {
              # 正式版压过所有渠道：beta 装机版就是靠"beta 那条不再是最新"才看得到正式版的
              Invoke-RestMethod -Uri "$supabaseUrl/rest/v1/latest_version?is_latest=eq.true" -Method Patch -Headers $headers -Body (@{is_latest = $false} | ConvertTo-Json) | Out-Null
            } else {
              Invoke-RestMethod -Uri "$supabaseUrl/rest/v1/latest_version?channel=eq.$channel" -Method Patch -Headers $headers -Body (@{is_latest = $false} | ConvertTo-Json) | Out-Null
            }
          } catch { Write-Host "No old versions to update" }
          $body = @{
            version = $ver
            channel = $channel
            download_url = $downloadUrl
            sha256 = $env:SHA256
            release_notes = "傻瓜启动器 v$ver"
            is_latest = $true
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "$supabaseUrl/rest/v1/latest_version" -Method Post -Headers $headers -Body $body | Out-Null
          Write-Host "Supabase updated: $channel -> $ver"
