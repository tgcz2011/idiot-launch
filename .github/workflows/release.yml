name: Build and Release (Flutter + Python)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（a.b.c.d 或 a.b.c.d-betaN）'
        required: true
        default: '3.0.0.0-beta1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Python backend (PyInstaller)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $secretsPath = "src\_secrets.py"
          if ($env:GITHUB_TOKEN) {
            $pyCode = "GITHUB_TOKEN = '$($env:GITHUB_TOKEN)'`n"
            [System.IO.File]::WriteAllText($secretsPath, $pyCode, (New-Object System.Text.UTF8Encoding $false))
          } else {
            [System.IO.File]::WriteAllText($secretsPath, "GITHUB_TOKEN = ''`n", (New-Object System.Text.UTF8Encoding $false))
          }
          pyinstaller --noconfirm --clean backend.spec

      - name: Build Flutter frontend (release)
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $flutterExe = "flutter_app\build\windows\x64\runner\Release\IdiotLaunch.exe"
          $backendExe = "dist\backend\IdiotLaunchBackend.exe"
          if (-not (Test-Path $flutterExe)) { throw "Flutter exe not found: $flutterExe" }
          if (-not (Test-Path $backendExe)) { throw "Backend exe not found: $backendExe" }
          Write-Host "Flutter exe: $((Get-Item $flutterExe).Length) bytes"
          Write-Host "Backend exe: $((Get-Item $backendExe).Length) bytes"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "IdiotLaunch.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $setups = Get-ChildItem "dist\*.exe"
          foreach ($s in $setups) {
            Write-Host "Installer: $($s.FullName) ($([math]::Round($s.Length / 1MB, 1)) MB)"
          }

      - name: Compute installer SHA-256
        shell: pwsh
        id: hash
        run: |
          $setup = Get-ChildItem "dist\*.exe" | Select-Object -First 1
          $hash = Get-FileHash -Path $setup.FullName -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"
          "sha256=$($hash.Hash)" >> $env:GITHUB_OUTPUT

      - name: Generate release body
        shell: pwsh
        id: body
        run: |
          $launcherVer = (Select-String -Path "src\core.py" -Pattern 'LAUNCHER_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $isBeta = $launcherVer -match 'beta|alpha|rc|pre'
          $betaNote = if ($isBeta) { "`n`n> **注意：这是 Beta 测试版本，可能不稳定。生产环境请使用正式版。`n" } else { "" }
          $body = @"
          ## Idiot Launch ${{ github.ref_name }}

          傻瓜式启动器，一键启动中考/高考倒计时或早晚读网页。
          $betaNote
          ### V3 架构升级
          - **Flutter 前端 + Python 后端**前后端分离架构
          - Material 3 侧边栏 UI，更美观流畅
          - 倒计时/秒表纯前端实现，响应更快
          - 后端常驻提供 API，频繁开关不中断

          ### 功能
          - **中考倒计时**：启动 Countdown Desktop（`--exam zhongkao`）
          - **高考倒计时**：启动 Countdown Desktop（`--exam gaokao`）
          - **早晚读**：内嵌浏览器打开，支持登录持久化
          - **壁纸&屏保设置**：一键唤起 Countdown Desktop 设置窗口
          - **倒计时/秒表**：Material 3 滚轮选择器，全屏，结束铃声
          - **随机抽学生**：早读登录后可用
          - Countdown Desktop 已合并到本项目，不再需要独立安装
          - 启动器自身自动更新（空闲5分钟自动升级）
          - 多镜像源下载 fallback + SHA-256 校验
          - D盘根目录+桌面快捷方式自动重建
          - 系统托盘图标，GUI 单实例

          ### 适用场景
          学校机房（C 盘冰点还原，安装到 D 盘持久化）

          ### 校验和（SHA-256）
          - 安装包哈希：`${{ steps.hash.outputs.sha256 }}`
          - 本机更新时对下载的安装包做 SHA-256 校验，哈希不一致会拒绝更新并重新下载
          "@
          [System.IO.File]::WriteAllText("release_body.md", $body, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Release body generated (v$launcherVer, beta=$isBeta)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Idiot Launch ${{ github.ref_name }}
          body_path: release_body.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
